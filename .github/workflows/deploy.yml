name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd frontend-web && npm ci

      - name: Build
        run: cd frontend-web && npm run build

      - name: Deploy to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
        run: |
          echo "Deploy workflow ready. Configure secrets in GitHub Settings."
          # Script de deploy será adicionado após configurar acesso Hostinger
